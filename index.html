<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2f5233">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wolf Jobs">
﻿<title>Wolf Architect Jobs</title>
<style>
  :root{
    --bg:#f6f7f1;
    --ink:#20261f;
    --ink-soft:#4c5449;
    --line:#dcded2;
    --green:#2f5233;
    --green-bg:#e4ece2;
    --green-text:#2f5233;
    --amber:#a6461d;
    --amber-bg:#f3e4da;
    --gray-bg:#eceee6;
    --card:#ffffff;
    --notes-bg:#fffdfb;
    --notes-line:#d9c3b3;
    --over:#7a3ea1;
    --over-bg:#f1e7f6;
    --danger:#b3261e;
    --danger-bg:#fbe9e7;
    --danger-ink:#7f1d18;
    --on-green:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14170f;
      --ink:#e8ebe1;
      --ink-soft:#a3aa99;
      --line:#333a2d;
      --green:#7fb383;
      --green-bg:#1f2c1f;
      --green-text:#9ccfa0;
      --amber:#e0895c;
      --amber-bg:#33211a;
      --gray-bg:#242a1f;
      --card:#1b1f17;
      --notes-bg:#221a15;
      --notes-line:#4d3a2e;
      --over:#c39ade;
      --over-bg:#2a1f33;
      --danger:#f2837a;
      --danger-bg:#33191a;
      --danger-ink:#f7bdb8;
      --on-green:#10140c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14170f;
    --ink:#e8ebe1;
    --ink-soft:#a3aa99;
    --line:#333a2d;
    --green:#7fb383;
    --green-bg:#1f2c1f;
    --green-text:#9ccfa0;
    --amber:#e0895c;
    --amber-bg:#33211a;
    --gray-bg:#242a1f;
    --card:#1b1f17;
    --notes-bg:#221a15;
    --notes-line:#4d3a2e;
    --over:#c39ade;
    --over-bg:#2a1f33;
    --danger:#f2837a;
    --danger-bg:#33191a;
    --danger-ink:#f7bdb8;
    --on-green:#10140c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    padding:16px 16px 0;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-size:1.25rem;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .subhead{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .asof{
    font-size:0.76rem;
    color:var(--green-text);
    font-weight:600;
    margin:0 0 4px;
  }
  .savenote{
    font-size:0.74rem;
    color:var(--ink-soft);
    margin:0 0 10px;
    font-variant-numeric:tabular-nums;
  }

  .tabs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    padding-bottom:12px;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:9px;
    padding:9px 6px;
    text-align:center;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
  }
  .tab .tab-name{
    display:block;
    font-size:0.86rem;
    font-weight:700;
    color:var(--ink);
  }
  .tab .tab-progress{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .tab.active{
    border-color:var(--green);
    background:var(--green-bg);
  }
  .tab.active .tab-name{color:var(--green-text);}
  .tab:focus-visible,.counter button:focus-visible,.report-btn:focus-visible,
  .report-copy:focus-visible,.report-close:focus-visible,
  .counter input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }

  .flags{
    margin:14px 16px 4px;
    border:1px solid var(--amber);
    border-radius:10px;
    background:var(--amber-bg);
    padding:12px 14px;
  }
  .flags h2{
    font-size:0.92rem;
    margin:0 0 8px;
    color:var(--amber);
    font-weight:700;
  }
  .flag-item{
    font-size:0.86rem;
    line-height:1.45;
    margin-bottom:8px;
  }
  .flag-item:last-child{margin-bottom:0;}
  textarea.notes{
    width:100%;
    margin-top:10px;
    border:1px solid var(--notes-line);
    border-radius:8px;
    background:var(--notes-bg);
    font-family:inherit;
    font-size:0.85rem;
    padding:8px 10px;
    resize:vertical;
    min-height:44px;
    color:var(--ink);
  }

  section.group{margin:22px 16px 0;}
  .group-title{
    font-size:1.02rem;
    font-weight:700;
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    background:var(--card);
    border-radius:8px;
    margin-bottom:8px;
    border-left:4px solid var(--gray-bg);
  }
  .item.partial{border-left-color:var(--amber);}
  .item.complete{border-left-color:var(--green);background:var(--green-bg);}
  .item.over{border-left-color:var(--over);background:var(--over-bg);}

  .item-info{flex:1;min-width:0;}
  .item-name{font-size:0.95rem;font-weight:600;}
  .item-target{font-size:0.78rem;color:var(--ink-soft);margin-top:1px;}

  .counter{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .counter button{
    width:34px;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--gray-bg);
    font-size:1.1rem;
    font-weight:700;
    color:var(--ink);
    touch-action:manipulation;
    cursor:pointer;
  }
  .counter button:active{background:var(--line);}
  .counter input{
    width:48px;
    height:34px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:0.98rem;
    font-weight:700;
    color:var(--ink);
    background:var(--card);
    -moz-appearance:textfield;
    font-variant-numeric:tabular-nums;
  }
  .counter input::-webkit-outer-spin-button,
  .counter input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }

  footer{
    margin:26px 16px 0;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:center;
  }

  .report-btn-wrap{padding:12px 16px 0;}
  .report-btn{
    width:100%;
    padding:12px;
    border:1px solid var(--green);
    background:var(--green);
    color:var(--on-green);
    border-radius:9px;
    font-weight:700;
    font-size:0.92rem;
    font-family:inherit;
    touch-action:manipulation;
    cursor:pointer;
  }
  .report-panel{
    margin:12px 16px 0;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    padding:12px;
  }
  .report-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    margin-bottom:8px;
  }
  .report-close{
    border:none;
    background:none;
    font-size:1.1rem;
    color:var(--ink-soft);
    padding:4px 8px;
    font-family:inherit;
    cursor:pointer;
  }
  .report-textarea{
    width:100%;
    min-height:280px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:0.76rem;
    line-height:1.4;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    color:var(--ink);
    background:var(--bg);
    white-space:pre-wrap;
  }
  .report-actions{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .report-copy{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--green);
    background:var(--green-bg);
    color:var(--green-text);
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .copy-status{
    font-size:0.82rem;
    color:var(--green-text);
    font-weight:600;
  }
  .save-warning{
    display:none;
    margin:12px 16px 0;
    border:1px solid var(--danger);
    background:var(--danger-bg);
    color:var(--danger-ink);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.84rem;
    line-height:1.4;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }

  .view-toggle{display:none;gap:8px;margin:14px 16px 0;}
  .view-toggle.on{display:flex;}
  .vt{
    flex:1;padding:10px 8px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;font-family:inherit;font-weight:700;font-size:0.86rem;
    color:var(--ink-soft);cursor:pointer;touch-action:manipulation;
  }
  .vt.active{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}

  .zone-intro{
    margin:14px 16px 0;font-size:0.8rem;line-height:1.45;color:var(--ink-soft);
  }
  .zone{
    margin:14px 16px 0;border:1px solid var(--line);border-radius:10px;
    background:var(--card);overflow:hidden;
  }
  .zone-head{
    display:flex;align-items:center;gap:12px;padding:11px 14px;
    background:var(--green-bg);border-bottom:1px solid var(--line);
  }
  .zone-loc{flex-shrink:0;display:block;}
  .zone-id{flex:1;min-width:0;}
  .zone-name{font-weight:700;font-size:1.0rem;color:var(--green-text);display:block;}
  .zone-place{
    font-size:0.76rem;color:var(--ink-soft);display:block;margin-top:2px;
  }
  .zone-count{
    font-size:0.74rem;color:var(--ink-soft);display:block;margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .loaded-btn{
    border:1px solid var(--green);background:var(--card);color:var(--green-text);
    border-radius:8px;padding:7px 11px;font-family:inherit;font-weight:700;
    font-size:0.78rem;cursor:pointer;touch-action:manipulation;
  }
  .zone.done .zone-head{background:var(--green);}
  .zone.done .zone-name,.zone.done .zone-count{color:var(--on-green);}
  .zone.done .loaded-btn{background:var(--on-green);color:var(--green);}
  .zrow{
    display:flex;align-items:baseline;gap:10px;padding:9px 14px;
    border-top:1px solid var(--line);
  }
  .zqty{
    font-weight:700;min-width:46px;text-align:right;
    font-variant-numeric:tabular-nums;font-size:0.98rem;
  }
  .zname{flex:1;font-size:0.9rem;}
  .zcode{font-size:0.7rem;color:var(--ink-soft);letter-spacing:0.05em;}
  .zflag{
    font-size:0.68rem;color:var(--amber);font-weight:700;letter-spacing:0.03em;
    white-space:nowrap;
  }
  .zone-note{
    margin:16px 16px 0;border:1px solid var(--amber);border-radius:10px;
    background:var(--amber-bg);padding:12px 14px;font-size:0.83rem;line-height:1.45;
  }
  .zone-note b{color:var(--amber);}

  .bed-no{
    flex-shrink:0;width:40px;height:40px;border-radius:50%;
    background:var(--green);color:var(--on-green);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:1.0rem;font-variant-numeric:tabular-nums;
  }
  .zone.done .bed-no{background:var(--on-green);color:var(--green);}
  .bed-pic{border-top:1px solid var(--line);background:var(--bg);}
  .bed-pic a{display:block;}
  .bed-img{width:100%;height:auto;display:block;}
  .zspace{
    display:block;font-size:0.74rem;color:var(--ink-soft);margin-top:2px;
  }
  .map-wrap{
    margin:14px 16px 0;border:1px solid var(--line);border-radius:10px;
    background:var(--card);overflow:hidden;
  }
  .map-title{
    padding:11px 14px;font-weight:700;font-size:0.95rem;
    background:var(--green-bg);color:var(--green-text);
    border-bottom:1px solid var(--line);
  }
  .map-img{width:100%;height:auto;display:block;background:var(--bg);}
  .map-hint{
    padding:9px 14px;font-size:0.76rem;color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  .offline-btn{
    display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:11px;
    border:1px solid var(--green);background:var(--card);color:var(--green-text);
    border-radius:9px;font-family:inherit;font-weight:700;font-size:0.85rem;
    cursor:pointer;touch-action:manipulation;
  }
  .offline-btn:disabled{opacity:0.65;}

  /* Marking-out summary. This is the number that matters when the plants are
     not on site yet: how many spots have to be put in the ground today. */
  .stake-summary{
    margin:14px 16px 0;border:1px solid var(--green);border-radius:10px;
    background:var(--green-bg);overflow:hidden;
  }
  .ss-head{
    padding:10px 14px;font-weight:700;font-size:0.95rem;color:var(--green-text);
    border-bottom:1px solid var(--line);
  }
  .ss-rows{padding:4px 14px;}
  .ss-row{
    padding:8px 0;font-size:0.88rem;line-height:1.4;
    border-bottom:1px solid var(--line);
  }
  .ss-row:last-child{border-bottom:none;}
  .ss-row b{font-size:1.35rem;font-variant-numeric:tabular-nums;margin-right:4px;}
  .ss-note{
    padding:10px 14px;border-top:1px solid var(--line);
    font-size:0.78rem;color:var(--ink-soft);
  }
  .chip{
    display:inline-block;margin:3px 4px 0 0;padding:2px 8px;border-radius:20px;
    font-size:0.72rem;font-weight:700;color:#fff;
  }
  /* Same four tints the drawing itself uses, so flag colour matches the sheet. */
  .chip-trees{background:#1b7f3b;}
  .chip-shrubs{background:#1565c0;}
  .chip-grasses{background:#c2620a;}
  .chip-perennials{background:#7b2fa3;}

  .bed-acts{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);}
  .act-btn{
    flex:1;padding:10px 8px;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);border-radius:9px;font-family:inherit;font-weight:700;
    font-size:0.84rem;cursor:pointer;touch-action:manipulation;
  }
  .act-btn.on{
    border-color:var(--green);background:var(--green);color:var(--on-green);
  }
  .sub-head{
    padding:9px 14px;border-top:1px solid var(--line);
    background:var(--gray-bg);font-size:0.76rem;font-weight:700;
    letter-spacing:0.03em;color:var(--ink-soft);text-transform:uppercase;
  }
  .zone.partdone{border-color:var(--green);}
  .zone.partdone .zone-head{background:var(--green-bg);}

  .how-box{
    margin:14px 16px 0;border:1px solid var(--line);border-radius:10px;
    background:var(--card);overflow:hidden;
  }
  .how-head{
    padding:11px 14px;font-weight:700;font-size:0.95rem;
    background:var(--gray-bg);border-bottom:1px solid var(--line);
  }
  .how-list{margin:0;padding:12px 14px 12px 32px;}
  .how-list li{font-size:0.87rem;line-height:1.5;margin-bottom:9px;}
  .how-list li:last-child{margin-bottom:0;}
  .how-note{
    padding:11px 14px;border-top:1px solid var(--line);
    background:var(--amber-bg);font-size:0.82rem;line-height:1.45;
  }

  .fit-box{
    border-top:1px solid var(--line);background:var(--bg);padding:11px 14px 13px;
  }
  .fit-head{
    font-size:0.76rem;font-weight:700;letter-spacing:0.03em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px;
  }
  .fit-inputs{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;
  }
  .fit-inputs label{font-size:0.82rem;color:var(--ink-soft);}
  .fit-inputs input{
    width:66px;padding:7px 8px;margin:0 3px;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--ink);
    font-family:inherit;font-size:0.95rem;font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .fit-area{
    font-weight:700;font-size:0.86rem;color:var(--green-text);
    font-variant-numeric:tabular-nums;
  }
  .fit-hint{font-size:0.8rem;color:var(--ink-soft);line-height:1.45;}
  .fit-row{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    padding:6px 0;border-top:1px solid var(--line);font-size:0.83rem;
  }
  .fit-name{flex:1;min-width:110px;}
  .fit-num{color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .fit-need{
    font-variant-numeric:tabular-nums;font-weight:700;min-width:66px;text-align:right;
  }
  .fit-total{border-top:2px solid var(--line);font-weight:700;}
  .fit-total .fit-name{color:var(--ink);}
  .fit-ok{color:var(--green-text);font-weight:700;}
  .fit-off{color:var(--amber);font-weight:700;}

  .loc-wrap{margin-top:10px;}
  .loc-btn{background:var(--green);color:var(--on-green);border-color:var(--green);}
  .loc-panel{
    margin:10px 16px 0;border:1px solid var(--green);border-radius:10px;
    background:var(--green-bg);overflow:hidden;
  }
  .loc-head{
    padding:9px 14px;font-size:0.78rem;font-weight:700;color:var(--green-text);
    border-bottom:1px solid var(--line);
  }
  .loc-row{
    display:flex;align-items:baseline;gap:10px;padding:9px 14px;
    border-bottom:1px solid var(--line);font-size:0.86rem;
  }
  .loc-row.first{background:var(--green);}
  .loc-row.first .loc-bed,.loc-row.first .loc-where,.loc-row.first .loc-d{
    color:var(--on-green);
  }
  .loc-bed{font-weight:700;min-width:64px;}
  .loc-where{flex:1;color:var(--ink-soft);font-size:0.8rem;}
  .loc-d{font-weight:700;font-variant-numeric:tabular-nums;}
  .loc-msg{
    padding:10px 14px;font-size:0.8rem;line-height:1.45;color:var(--ink-soft);
  }

  /* Build-zone banner. One per zone, in the precon's order. */
  .zonebar{
    margin:22px 16px 0;border-radius:10px;padding:12px 14px;
    background:var(--green);color:var(--on-green);
  }
  .zb-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .zb-tag{
    font-weight:700;font-size:0.74rem;letter-spacing:0.06em;
    border:1px solid var(--on-green);border-radius:5px;padding:2px 6px;
  }
  .zb-name{font-weight:700;font-size:1.06rem;}
  .zb-crew{
    margin-left:auto;font-size:0.78rem;font-weight:700;opacity:0.9;
  }
  .zb-sub{
    font-size:0.78rem;margin-top:6px;opacity:0.9;
    font-variant-numeric:tabular-nums;
  }
  .zb-note{font-size:0.79rem;line-height:1.45;margin-top:7px;opacity:0.85;}
  /* The frontage is built last and carries the most work -- flag it amber. */
  .zonebar-z4{background:var(--amber);}

  /* Picture overlay. Opening a new tab in a standalone PWA hands you to the
     browser and back never comes home, so pictures open in here instead. */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    background:rgba(8,10,7,0.96);
    display:flex;align-items:center;justify-content:center;
    overflow:auto;padding:12px;
  }
  .lb-img{
    max-width:100%;height:auto;display:block;
    border-radius:6px;background:#fff;
  }
  .src-box{
    margin:14px 16px 4px;border:1px solid var(--green);border-radius:10px;
    background:var(--green-bg);padding:12px 14px;
  }
  .src-head{
    font-size:0.92rem;font-weight:700;color:var(--green-text);margin-bottom:7px;
  }
  .src-note{font-size:0.85rem;line-height:1.45;margin-bottom:4px;}

  .lb-close{
    position:fixed;top:10px;right:10px;z-index:101;
    padding:11px 16px;border-radius:9px;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(20,24,18,0.92);color:#fff;
    font-family:inherit;font-weight:700;font-size:0.88rem;
    cursor:pointer;touch-action:manipulation;
  }
</style>
</head>
<body>

<header>
  <h1>Wolf Architect Jobs</h1>

function decode(html){
  var d = document.createElement("textarea");
  d.innerHTML = html;
  return d.value;
}

function slug(name){
  return decode(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function readLocal(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    if(!raw) return null;
    var v = JSON.parse(raw);
    return (v && typeof v === "object") ? v : null;
  }catch(e){ return null; }
}

function writeLocal(p){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(p)); return true; }
  catch(e){ return false; }
}

function setSaveNote(msg){
  var el = document.getElementById("saveNote");
  if(el) el.textContent = msg;
}

var MSG_LOCAL_ONLY = "This copy saves to this device only. Counts stay in this browser - they will not follow you to another phone.";
var MSG_OFFLINE = "Working offline. Counts are held on this device and will sync when you are back on signal.";
var syncAvailable = null; // null = not checked yet, false = no sync here, true = sync exists

function setOffline(isOffline, msg){
  var el = document.getElementById("saveWarning");
  if(!el) return;
  el.style.display = isOffline ? "block" : "none";
  if(isOffline) el.textContent = msg || (syncAvailable === false ? MSG_LOCAL_ONLY : MSG_OFFLINE);
}

function payload(){
  return {counts: state, notes: notes, staked: staked, planted: planted,
          measured: measured, updatedAt: new Date().toISOString()};
}

function applyPayload(p){
  if(!p) return;
  if(p.counts && typeof p.counts === "object") state = Object.assign({}, p.counts);
  if(p.notes && typeof p.notes === "object") notes = Object.assign({}, p.notes);
  if(p.staked && typeof p.staked === "object") staked = Object.assign({}, p.staked);
  if(p.planted && typeof p.planted === "object") planted = Object.assign({}, p.planted);
  if(p.measured && typeof p.measured === "object") measured = Object.assign({}, p.measured);
  // Anything ticked before the staked/planted split meant "done with".
  if(p.loaded && typeof p.loaded === "object"){
    Object.keys(p.loaded).forEach(function(k){
      if(p.loaded[k] && planted[k] === undefined) planted[k] = true;
    });
  }
}

function fillMissingFromSeed(){
  Object.keys(JOBS).forEach(function(jobKey){
    Object.keys(JOBS[jobKey].groups).forEach(function(gk){
      JOBS[jobKey].groups[gk].items.forEach(function(row){
        var k = jobKey + ":" + slug(row[0]);
        if(state[k] === undefined || state[k] === null){
          state[k] = SEED[k] !== undefined ? SEED[k] : 0;
        }
      });
    });
  });
}

function scheduleSave(){
  var p = payload();
  var localOk = writeLocal(p);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if(!dbDoc){
      setOffline(true);
      setSaveNote(localOk
        ? "Saved on this device only — not synced."
        : "NOT SAVING here. Send the status report before you close this.");
      return;
    }
    dbDoc.set(p).then(function(){
      lastSavedAt = Date.parse(p.updatedAt);
      setOffline(false);
      var t = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
      setSaveNote("Saved " + t + " — safe to close.");
    }).catch(function(){
      setOffline(true);
      setSaveNote("Saved on this device — will sync when signal returns.");
    });
  }, 250);
}

function jobProgress(jobKey){
  var complete = 0, total = 0;
  var job = JOBS[jobKey];
  Object.keys(job.groups).forEach(function(gk){
    job.groups[gk].items.forEach(function(row){
      total++;
      var k = jobKey + ":" + slug(row[0]);
      if((state[k] || 0) >= row[1]) complete++;
    });
  });
  return {complete: complete, total: total};
}

function renderTabs(){
  var tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(JOBS).forEach(function(jobKey){
    var p = jobProgress(jobKey);
    var btn = document.createElement("button");
    btn.className = "tab" + (jobKey === currentJob ? " active" : "");
    btn.innerHTML = '<span class="tab-name">' + JOBS[jobKey].short +
      '</span><span class="tab-progress">' + p.complete + "/" + p.total + " complete</span>";
    btn.addEventListener("click", function(){
      if(jobKey === currentJob) return;
      goto(function(){
        currentJob = jobKey;
        // The zone pull list only exists for Home2Suites; leaving that tab
        // drops back to the species view so the toggle never lies.
        if(jobKey !== "h2s") view = "species";
      });
    });
    tabsEl.appendChild(btn);
  });
}


// WSRCC only. Its plants live at the nursery in Anchorage, not at the Home2
// Suites storage area, and that is right -- it is an Anchorage job. A place to
// record where material is actually coming from, so nobody goes hunting.
function renderSourceNote(slot){
  if(currentJob !== "wsrcc") return;
  var box = document.createElement("div");
  box.className = "src-box";
  box.innerHTML = '<div class="src-head">Where this material is coming from</div>' +
    '<div class="src-note">Plants are at the <b>nursery in Anchorage</b>, not at the ' +
    "Home2 Suites storage area. That is correct &mdash; WSRCC is an Anchorage job. " +
    "Nothing to chase.</div>";
  var ta = document.createElement("textarea");
  ta.className = "notes";
  ta.id = "source-wsrcc";
  ta.placeholder = "Pickup point, who to call, what has moved...";
  ta.value = notes["source-wsrcc"] || "";
  var t;
  ta.addEventListener("input", function(){
    notes["source-wsrcc"] = ta.value;
    clearTimeout(t);
    t = setTimeout(scheduleSave, 500);
  });
  box.appendChild(ta);
  slot.appendChild(box);
}

    notes[notesId] = ta.value;
    scheduleSave();
  });
}

function itemClass(v, target){
  return "item" + (v > target ? " over" : v === target ? " complete" : v > 0 ? " partial" : "");
}

function renderItem(jobKey, name, target, isAlt){
  var k = jobKey + ":" + slug(name);
  var received = state[k] || 0;
  var wrap = document.createElement("div");
  wrap.className = itemClass(received, target);

  var info = document.createElement("div");
  info.className = "item-info";
  info.innerHTML = '<div class="item-name">' + name + '</div><div class="item-target">need ' +
    target + (isAlt ? " (alt / optional)" : "") + "</div>";

  var counter = document.createElement("div");
  counter.className = "counter";

  var minus = document.createElement("button");
  minus.textContent = "âˆ’";
  minus.setAttribute("aria-label", "decrease " + decode(name));

  var input = document.createElement("input");
  input.type = "number";
  input.inputMode = "numeric";
  input.min = "0";
  input.value = received;
  input.setAttribute("aria-label", decode(name) + " received count");

  var plus = document.createElement("button");
  plus.textContent = "+";
  plus.setAttribute("aria-label", "increase " + decode(name));

  function commit(newVal){
    newVal = Math.max(0, parseInt(newVal, 10) || 0);
    state[k] = newVal;
    input.value = newVal;
    wrap.className = itemClass(newVal, target);
    renderTabs();
    scheduleSave();
  }

  minus.addEventListener("click", function(){ commit((state[k] || 0) - 1); });
  plus.addEventListener("click", function(){ commit((state[k] || 0) + 1); });
  input.addEventListener("change", function(){ commit(input.value); });

  counter.appendChild(minus);
  counter.appendChild(input);
  counter.appendChild(plus);
  wrap.appendChild(info);
  wrap.appendChild(counter);
  return wrap;
}

// Bed crops and the site map are ordinary files next to the page. The published
// Artifact copy cannot load them (its sandbox blocks external images and it has
// no folder of its own), so every <img> hides itself on error and the lists
// still work. The installed copy on the phone is the one that shows pictures.
var BED_IMG = "./beds/";

// The sheet tints callouts by category. Same four groups here, so a flag colour
// on the ground can match the colour on the drawing.
var CATEGORY = {
  AGN: "trees", AP: "trees", BP: "trees", MSB: "trees", PTE: "trees", PT: "trees",
  CS: "shrubs", JH: "shrubs", JS: "shrubs", RSA: "shrubs",
  SBG: "shrubs", SBT: "shrubs", SPA: "shrubs", SV: "shrubs",
  CAK: "grasses", DFA: "grasses",
  A: "perennials", AD: "perennials", APV: "perennials",
  G: "perennials", H: "perennials", IS: "perennials",
};

// Trees and shrubs are drawn as individual symbols, so each one is a spot to
// stake. Grasses and perennials are massed at an on-centre spacing -- you mark
// the bed edge and the spacing, not 305 separate holes.
function isStaked(code){
  var c = CATEGORY[code];
  return c === "trees" || c === "shrubs";
}

// Every massed species on this sheet is triangular (staggered rows), checked
// against the schedule's Notes column. Triangular packs ~15% more plants into
// the same area than square rows, so the distinction matters for a count.
//
//   row spacing = OC x 0.866      (equilateral triangle height)
//   area/plant  = OC^2 x 0.866
var ROOT3_2 = 0.8660254;

function ocOf(code){
  var m = SPACING[code] && SPACING[code].match(/(\d+)"/);
  return m ? parseInt(m[1], 10) : null;
}

function rowSpacing(oc){ return Math.round(oc * ROOT3_2 * 10) / 10; }

function sqftPerPlant(oc){ return (oc * oc * ROOT3_2) / 144; }

function plantsForArea(oc, sqft){ return Math.round(sqft / sqftPerPlant(oc)); }

function spacingLine(code, qty){
  var oc = ocOf(code);
  if(oc === null) return "";
  var covers = Math.round(qty * sqftPerPlant(oc));
  return oc + '" OC triangular &middot; rows ' + rowSpacing(oc) +
         '" apart &middot; covers about ' + covers + " sq ft";
}

function imgOrNothing(src, alt, cls){
  return '<img class="' + cls + '" src="' + src + '" alt="' + alt +
         '" loading="lazy" decoding="async" onerror="this.remove()">';
}

function bedRow(code, qty){
  var sp = SPACING[code]
    ? '<span class="zspace">' + spacingLine(code, qty) + "</span>" : "";
  var flag = DISCREPANCY[code] ? '<span class="zflag">check plan</span>' : "";
  return '<div class="zrow">' +
    '<span class="zqty">' + qty + "</span>" +
    '<span class="zname">' + SPECIES[code] +
      ' <span class="zcode">' + code + "</span>" + sp + "</span>" +
    flag + "</div>";
}

function bedSplit(items){
  var stake = [], mass = [];
  Object.keys(items).forEach(function(c){
    (isStaked(c) ? stake : mass).push(c);
  });
  return {stake: stake, mass: mass};
}

function countBy(pred){
  var n = 0;
  BEDS.forEach(function(b){
    Object.keys(b.items).forEach(function(c){
      if(pred(c)) n += b.items[c];
    });
  });
  return n;
}

// Measure the bed, and the plan's count either fits it or it does not. Catches a
// bed dug the wrong size before anything goes in the ground.
function renderFit(bed, massCodes){
  var m = measured[bed.bed] || {};
  var L = parseFloat(m.l), W = parseFloat(m.w);
  var area = (L > 0 && W > 0) ? L * W : null;

  // Each species needs its own area at its own spacing. They share the bed, so
  // the total of those areas is what has to fit -- not any one of them alone.
  var needTotal = 0;
  var rows = massCodes.map(function(c){
    var oc = ocOf(c);
    if(oc === null) return "";
    var need = bed.items[c] * sqftPerPlant(oc);
    needTotal += need;
    return '<div class="fit-row"><span class="fit-name">' + SPECIES[c] + "</span>" +
      '<span class="fit-num">' + bed.items[c] + ' at ' + oc + '" OC</span>' +
      '<span class="fit-need">' + Math.round(need) + " sq ft</span></div>";
  }).join("");

  var total = '<div class="fit-row fit-total"><span class="fit-name">' +
    "Plan needs</span><span class=\"fit-num\"></span>" +
    '<span class="fit-need">' + Math.round(needTotal) + " sq ft</span></div>";

  var verdict = "";
  if(area !== null){
    var d = area - needTotal;
    var pct = needTotal > 0 ? Math.abs(d) / needTotal * 100 : 0;
    var cls = pct <= 12 ? "fit-ok" : "fit-off";
    var word = Math.abs(d) < 2 ? "matches the plan"
      : d > 0 ? (Math.round(d) + " sq ft spare")
              : (Math.round(-d) + " sq ft short \u2014 it will not all fit");
    verdict = '<div class="fit-row fit-total"><span class="fit-name">' +
      "You measured</span>" +
      '<span class="fit-num">' + Math.round(area) + " sq ft</span>" +
      '<span class="' + cls + '">' + word + "</span></div>";
  }

  return '<div class="fit-box">' +
    '<div class="fit-head">Check the bed against the count</div>' +
    '<div class="fit-inputs">' +
      '<label>Length <input type="number" inputmode="decimal" min="0" step="0.5" ' +
        'data-bed="' + bed.bed + '" data-dim="l" value="' + (m.l || "") + '"> ft</label>' +
      '<label>Width <input type="number" inputmode="decimal" min="0" step="0.5" ' +
        'data-bed="' + bed.bed + '" data-dim="w" value="' + (m.w || "") + '"> ft</label>' +
    "</div>" +
    rows + total + verdict +
    (area === null ? '<div class="fit-hint">Pace the bed and put the two numbers ' +
      "in. Beds are rarely a clean rectangle &mdash; use the average length and " +
      "width, it only has to be close.</div>" : "") +
    "</div>";
}


// Bed coordinates come from aligning the plan's property line to the borough's
// parcel polygon -- see tools/georeference.py. Two caveats are surfaced in the
// UI rather than hidden: a bed's position is taken from its CALLOUT, which sits
// beside the bed on the end of a leader line, and phone GPS is good to maybe
// 10-15 ft. So this narrows it to a short list; the picture on the card settles
// which one you are actually standing in.
var myPos = null;

function distFt(lat1, lon1, lat2, lon2){
  var mLat = 111132.0, mLon = 111320.0 * Math.cos(lat1 * Math.PI / 180);
  var dx = (lon2 - lon1) * mLon, dy = (lat2 - lat1) * mLat;
  return Math.sqrt(dx * dx + dy * dy) * 3.280839895;
}

function nearestBeds(n){
  if(!myPos) return [];
  return BEDS.filter(function(b){ return b.lat; })
    .map(function(b){ return {b: b, d: distFt(myPos.lat, myPos.lon, b.lat, b.lon)}; })
    .sort(function(x, y){ return x.d - y.d; })
    .slice(0, n);
}

function locateMe(btn, panel){
  if(!navigator.geolocation){
    panel.innerHTML = '<div class="loc-msg">This phone will not give a position.</div>';
    return;
  }
  btn.disabled = true;
  btn.textContent = "Finding you...";
  navigator.geolocation.getCurrentPosition(function(pos){
    myPos = {lat: pos.coords.latitude, lon: pos.coords.longitude,
             acc: pos.coords.accuracy * 3.280839895};
    btn.disabled = false;
    renderBeds();
    var top = nearestBeds(1)[0];
    if(top){
      var card = document.getElementById("bed-" + top.b.bed);
      if(card){ card.scrollIntoView({block: "start"}); window.scrollBy(0, -60); }
    }
  }, function(err){
    btn.disabled = false;
    btn.textContent = "Where am I?";
    panel.innerHTML = '<div class="loc-msg">' +
      (err.code === 1 ? "Location is blocked. Allow it for this site in the browser."
                      : "Could not get a position out here.") + "</div>";
  }, {enableHighAccuracy: true, timeout: 20000, maximumAge: 10000});
}

function locationPanel(){
  if(!myPos) return "";
  var near = nearestBeds(3);
  var rows = near.map(function(n, i){
    return '<div class="loc-row' + (i === 0 ? " first" : "") + '">' +
      '<span class="loc-bed">Bed ' + n.b.bed.replace("B", "") + "</span>" +
      '<span class="loc-where">' + n.b.where + "</span>" +
      '<span class="loc-d">' + Math.round(n.d) + " ft</span></div>";
  }).join("");
  var warn = "";
  if(near.length > 1 && (near[1].d - near[0].d) < myPos.acc){
    warn = '<div class="loc-msg">Those top two are closer together than your GPS ' +
           "is accurate. Check the picture on the card before you trust it.</div>";
  }
  return '<div class="loc-panel"><div class="loc-head">Nearest beds &mdash; GPS good to about ' +
    Math.round(myPos.acc) + " ft</div>" + rows + warn + "</div>";
}


// ---- back button --------------------------------------------------------
// Standalone PWAs start with a single history entry, so a back gesture exits
// the app. Each in-app step pushes one, and popstate walks them back.
var lightboxSrc = null;
var restoring = false;

function viewState(){
  return {job: currentJob, view: view, lb: lightboxSrc, scroll: window.scrollY};
}

// Stamp where we are (including scroll) into the current entry, make the
// change, then push the entry we arrived at. Doing it the other way round
// pushes the state being left, and one back lands two steps away.
function goto(mutate, keepScroll){
  if(restoring){ mutate(); renderAll(); return; }
  try{ history.replaceState(viewState(), ""); }catch(e){}
  mutate();
  renderAll();
  if(!keepScroll) window.scrollTo(0, 0);
  try{ history.pushState(viewState(), ""); }catch(e){}
}

function showLightbox(src){
  lightboxSrc = src;
  var box = document.getElementById("lightbox");
  var img = document.getElementById("lbImg");
  if(src){
    img.src = src;
    box.hidden = false;
    document.body.style.overflow = "hidden";
  } else {
    box.hidden = true;
    img.removeAttribute("src");
    document.body.style.overflow = "";
  }
}

function openPicture(src){
  try{ history.replaceState(viewState(), ""); }catch(e){}
  showLightbox(src);
  try{ history.pushState(viewState(), ""); }catch(e){}
}

function closePicture(){
  if(lightboxSrc){ history.back(); }
}

window.addEventListener("popstate", function(ev){
  var s = ev.state || {job: "h2s", view: "species", lb: null};
  restoring = true;
  currentJob = s.job || "h2s";
  view = s.view || "species";
  showLightbox(s.lb || null);
  renderAll();
  if(typeof s.scroll === "number"){
    window.scrollTo(0, s.scroll);
  }
  restoring = false;
});

// Pictures open in the overlay, not a new tab.
function wirePictures(root){
  root.querySelectorAll("a[data-lb]").forEach(function(a){
    a.addEventListener("click", function(ev){

      openPicture(a.getAttribute("href"));
    });
  });
}

// Warms the service worker's cache so the pictures are there with no signal.
function saveMapsOffline(btn){
  var urls = [BED_IMG + "site-map.jpg"].concat(BEDS.map(function(b){
    return BED_IMG + b.bed + ".jpg";
  }));
  var done = 0, failed = 0;
  btn.disabled = true;
  function tick(){
    btn.textContent = "Saving " + (done + failed) + " of " + urls.length + "...";
  }
  tick();
  Promise.all(urls.map(function(u){
    return fetch(u, {cache: "reload"}).then(function(r){
      if(r.ok) done++; else failed++;
    }).catch(function(){ failed++; }).then(tick);
  })).then(function(){
    btn.disabled = false;
    btn.textContent = failed
      ? "Saved " + done + " of " + urls.length + " - retry when you have signal"
      : "Saved for offline - all " + done + " maps";
  });
}

function renderAll(){

  var toggle = document.getElementById("viewToggle");
  toggle.classList.toggle("on", showZones);
  document.getElementById("vtSpecies").classList.toggle("active", view === "species");
  document.getElementById("vtZones").classList.toggle("active", view === "zones");

  if(showZones && view === "zones"){
    document.getElementById("flagsSlot").innerHTML = "";
    renderBeds();
  } else {
    renderFlags();
    renderGroups();
  }
}

function generateReport(){
  var lines = [];
  lines.push("TITAN ALASKA -- PLANT SORT STATUS");
  lines.push(new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric", year: "numeric"
  }));
  lines.push("");
  Object.keys(JOBS).forEach(function(jobKey){
    var job = JOBS[jobKey];
    var p = jobProgress(jobKey);
    lines.push(decode(job.label).toUpperCase() + " (" + p.complete + "/" + p.total + " complete)");
    Object.keys(job.groups).forEach(function(gk){
      job.groups[gk].items.forEach(function(row){
        var name = row[0], target = row[1], isAlt = row[2];
        var k = jobKey + ":" + slug(name);
        var received = state[k] || 0;
        var status;
        if(received > target) status = "OVER by " + (received - target);
        else if(received === target) status = "complete";
        else if(received > 0) status = "short " + (target - received);
        else status = "open";
        lines.push("- " + decode(name) + ": " + received + "/" + target +
          (isAlt ? " (alt)" : "") + " -- " + status);
      });
    });
    if(job.flags && job.flags.length){
      lines.push("Flags:");
      job.flags.forEach(function(f){
        var tmp = document.createElement("div");
        tmp.innerHTML = f;
        lines.push("- " + (tmp.textContent || "").trim());
      });
    }
    var noteText = (notes["notes-" + jobKey] || "").trim();
    if(noteText){
      lines.push("Notes:");
      lines.push(noteText);
    }
    lines.push("");
  });

  lines.push("HOME2SUITES -- PULL LIST BY BED (from sheet L102)");
  lines.push("In build order: north yard, east (Crew A), west (Crew B), frontage last. " + BEDS.length + " beds, " +
             BEDS.reduce(function(n, b){ return n + b.units; }, 0) + " units.");
  lines.push("");
  var rz = null;
  BEDS.forEach(function(b){
    if(b.zone !== rz){
      rz = b.zone;
      lines.push("");
      lines.push("== " + b.zone + " " + ZONES[b.zone].name.toUpperCase() +
                 " -- " + ZONES[b.zone].crew + " ==");
    }
    lines.push("Bed " + b.bed.replace("B", "") + " -- " + b.where +
               " (" + b.units + " units)" +
               (staked[b.bed] ? " [STAKED]" : "") +
               (planted[b.bed] ? " [PLANTED]" : ""));
    Object.keys(b.items).forEach(function(c){
      lines.push("  " + b.items[c] + " x " + SPECIES[c] + " (" + c + ")" +
                 (SPACING[c] ? "  " + ocOf(c) + "\" OC triangular, rows " +
                   rowSpacing(ocOf(c)) + "\" apart" : "") +
                 (DISCREPANCY[c] ? "  ** " + DISCREPANCY[c] + " **" : ""));
    });
  });
  lines.push("");
  lines.push("NOTE: three species do not reconcile against the sheet's own schedule --");
  Object.keys(DISCREPANCY).forEach(function(c){
    lines.push("  " + SPECIES[c] + ": " + DISCREPANCY[c]);
  });
  lines.push("Every other species matches exactly. Confirm with Corvus Design before ordering.");
  lines.push("");

  return lines.join("\n");
}

function wireReportUI(){
  var reportBtn = document.getElementById("reportBtn");
  var panel = document.getElementById("reportPanel");
  var textarea = document.getElementById("reportText");
  var copyBtn = document.getElementById("copyReportBtn");
  var closeBtn = document.getElementById("closeReportBtn");
  var statusEl = document.getElementById("copyStatus");

  function selectAll(){
    textarea.focus();
    textarea.setSelectionRange(0, textarea.value.length);
  }

  reportBtn.addEventListener("click", function(){
    var text = generateReport();
    textarea.value = text;
    panel.style.display = "block";
    panel.scrollIntoView({behavior: "smooth", block: "start"});
    selectAll();
    if(navigator.share){
      navigator.share({text: text, title: "Titan Alaska -- Plant Sort Status"})
        .then(function(){
          statusEl.textContent = "Shared";
          setTimeout(function(){ statusEl.textContent = ""; }, 3000);
        })
        .catch(function(){
          statusEl.textContent = "Text is selected below — long-press and Copy";
        });
      return;
    }
    statusEl.textContent = "Text is selected below — long-press and Copy";
  });

  closeBtn.addEventListener("click", function(){
    panel.style.display = "none";
  });

  copyBtn.addEventListener("click", function(){
    selectAll();
    function fallback(){
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      statusEl.textContent = ok ? "Copied" : "Long-press the text above and Copy";
      setTimeout(function(){ statusEl.textContent = ""; }, 3000);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(textarea.value).then(function(){
        statusEl.textContent = "Copied";
        setTimeout(function(){ statusEl.textContent = ""; }, 3000);
      }).catch(fallback);
    } else {
      fallback();
    }
  });
}

function init(){
  document.getElementById("dateLine").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  // 1. Paint straight away from the local mirror, or the 9/8 baseline.
  var local = readLocal();
  applyPayload(local);
  fillMissingFromSeed();
  document.getElementById("vtSpecies").addEventListener("click", function(){
    if(view === "species") return;
    goto(function(){ view = "species"; });
  });
  document.getElementById("vtZones").addEventListener("click", function(){
    if(view === "zones") return;
    goto(function(){ view = "zones"; });
  });
  document.getElementById("lbClose").addEventListener("click", closePicture);
  document.getElementById("lightbox").addEventListener("click", function(ev){
    if(ev.target && ev.target.id === "lightbox") closePicture();
  });
  // Seed the first entry so the first back gesture has somewhere to land.
  try{ history.replaceState(viewState(), ""); }catch(e){}

  renderAll();
  wireReportUI();
  setSaveNote(local ? "Counts loaded from this device." : "Starting from the September 8 baseline.");

  // 2. Then reach for the shared store and take it if it is newer.
  (function(){
    var usePromise;
    try{ usePromise = claude.use("db"); }
    catch(e){ usePromise = Promise.resolve(null); }

    Promise.resolve(usePromise).then(function(db){
      if(!db){
        syncAvailable = false;
        setOffline(true, MSG_LOCAL_ONLY);
        setSaveNote("Saves to this device only.");
        return;
      }
      syncAvailable = true;
      dbDoc = db.doc(DOC_PATH);

      return dbDoc.get().then(function(snap){
        var remote = (snap && snap.data) ? snap.data : snap;
        var localAt = (local && local.updatedAt) ? Date.parse(local.updatedAt) : 0;
        var remoteAt = (remote && remote.updatedAt) ? Date.parse(remote.updatedAt) : 0;

        if(remote && remote.counts && remoteAt >= localAt){
          applyPayload(remote);
          fillMissingFromSeed();
          lastSavedAt = remoteAt;
          renderAll();
          setSaveNote("Synced — showing the latest counts.");
          setOffline(false);
        } else {
          var p = payload();
          return dbDoc.set(p).then(function(){
            lastSavedAt = Date.parse(p.updatedAt);
            setSaveNote("Synced — this device had the newer counts.");
            setOffline(false);
          });
        }
      }).then(function(){
        try{
          dbDoc.onSnapshot(function(snap){
            var remote = (snap && snap.data) ? snap.data : snap;
            if(!remote || !remote.updatedAt || !remote.counts) return;
            var at = Date.parse(remote.updatedAt);
            if(at <= lastSavedAt) return;
            lastSavedAt = at;
            applyPayload(remote);
            fillMissingFromSeed();
            renderAll();
          });
        }catch(e){ /* live updates are a bonus */ }
      });
    }).catch(function(){
      setOffline(true);
      setSaveNote("Saved on this device — will sync when signal returns.");
    });
  })();
}

init();
</script>
