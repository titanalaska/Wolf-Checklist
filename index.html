<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2f5233">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Wolf Architect Jobs</title>
<style>
  :root{
    --bg:#f6f7f1;
    --ink:#20261f;
    --ink-soft:#4c5449;
    --line:#dcded2;
    --green:#2f5233;
    --green-bg:#e4ece2;
    --green-text:#2f5233;
    --amber:#a6461d;
    --amber-bg:#f3e4da;
    --gray-bg:#eceee6;
    --card:#ffffff;
    --notes-bg:#fffdfb;
    --notes-line:#d9c3b3;
    --over:#7a3ea1;
    --over-bg:#f1e7f6;
    --danger:#b3261e;
    --danger-bg:#fbe9e7;
    --danger-ink:#7f1d18;
    --on-green:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14170f;
      --ink:#e8ebe1;
      --ink-soft:#a3aa99;
      --line:#333a2d;
      --green:#7fb383;
      --green-bg:#1f2c1f;
      --green-text:#9ccfa0;
      --amber:#e0895c;
      --amber-bg:#33211a;
      --gray-bg:#242a1f;
      --card:#1b1f17;
      --notes-bg:#221a15;
      --notes-line:#4d3a2e;
      --over:#c39ade;
      --over-bg:#2a1f33;
      --danger:#f2837a;
      --danger-bg:#33191a;
      --danger-ink:#f7bdb8;
      --on-green:#10140c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14170f;
    --ink:#e8ebe1;
    --ink-soft:#a3aa99;
    --line:#333a2d;
    --green:#7fb383;
    --green-bg:#1f2c1f;
    --green-text:#9ccfa0;
    --amber:#e0895c;
    --amber-bg:#33211a;
    --gray-bg:#242a1f;
    --card:#1b1f17;
    --notes-bg:#221a15;
    --notes-line:#4d3a2e;
    --over:#c39ade;
    --over-bg:#2a1f33;
    --danger:#f2837a;
    --danger-bg:#33191a;
    --danger-ink:#f7bdb8;
    --on-green:#10140c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    padding:16px 16px 0;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-size:1.25rem;
    font-weight:700;
    margin:0 0 2px;
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .subhead{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .asof{
    font-size:0.76rem;
    color:var(--green-text);
    font-weight:600;
    margin:0 0 4px;
  }
  .savenote{
    font-size:0.74rem;
    color:var(--ink-soft);
    margin:0 0 10px;
    font-variant-numeric:tabular-nums;
  }

  .tabs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    padding-bottom:12px;
  }
  .tab{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:9px;
    padding:9px 6px;
    text-align:center;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
  }
  .tab .tab-name{
    display:block;
    font-size:0.86rem;
    font-weight:700;
    color:var(--ink);
  }
  .tab .tab-progress{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .tab.active{
    border-color:var(--green);
    background:var(--green-bg);
  }
  .tab.active .tab-name{color:var(--green-text);}
  .tab:focus-visible,.counter button:focus-visible,.report-btn:focus-visible,
  .report-copy:focus-visible,.report-close:focus-visible,
  .counter input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }

  .flags{
    margin:14px 16px 4px;
    border:1px solid var(--amber);
    border-radius:10px;
    background:var(--amber-bg);
    padding:12px 14px;
  }
  .flags h2{
    font-size:0.92rem;
    margin:0 0 8px;
    color:var(--amber);
    font-weight:700;
  }
  .flag-item{
    font-size:0.86rem;
    line-height:1.45;
    margin-bottom:8px;
  }
  .flag-item:last-child{margin-bottom:0;}
  textarea.notes{
    width:100%;
    margin-top:10px;
    border:1px solid var(--notes-line);
    border-radius:8px;
    background:var(--notes-bg);
    font-family:inherit;
    font-size:0.85rem;
    padding:8px 10px;
    resize:vertical;
    min-height:44px;
    color:var(--ink);
  }

  section.group{margin:22px 16px 0;}
  .group-title{
    font-size:1.02rem;
    font-weight:700;
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    background:var(--card);
    border-radius:8px;
    margin-bottom:8px;
    border-left:4px solid var(--gray-bg);
  }
  .item.partial{border-left-color:var(--amber);}
  .item.complete{border-left-color:var(--green);background:var(--green-bg);}
  .item.over{border-left-color:var(--over);background:var(--over-bg);}

  .item-info{flex:1;min-width:0;}
  .item-name{font-size:0.95rem;font-weight:600;}
  .item-target{font-size:0.78rem;color:var(--ink-soft);margin-top:1px;}

  .counter{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .counter button{
    width:34px;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--gray-bg);
    font-size:1.1rem;
    font-weight:700;
    color:var(--ink);
    touch-action:manipulation;
    cursor:pointer;
  }
  .counter button:active{background:var(--line);}
  .counter input{
    width:48px;
    height:34px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:0.98rem;
    font-weight:700;
    color:var(--ink);
    background:var(--card);
    -moz-appearance:textfield;
    font-variant-numeric:tabular-nums;
  }
  .counter input::-webkit-outer-spin-button,
  .counter input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }

  footer{
    margin:26px 16px 0;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:center;
  }

  .report-btn-wrap{padding:12px 16px 0;}
  .report-btn{
    width:100%;
    padding:12px;
    border:1px solid var(--green);
    background:var(--green);
    color:var(--on-green);
    border-radius:9px;
    font-weight:700;
    font-size:0.92rem;
    font-family:inherit;
    touch-action:manipulation;
    cursor:pointer;
  }
  .report-panel{
    margin:12px 16px 0;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    padding:12px;
  }
  .report-panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    margin-bottom:8px;
  }
  .report-close{
    border:none;
    background:none;
    font-size:1.1rem;
    color:var(--ink-soft);
    padding:4px 8px;
    font-family:inherit;
    cursor:pointer;
  }
  .report-textarea{
    width:100%;
    min-height:280px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:0.76rem;
    line-height:1.4;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    color:var(--ink);
    background:var(--bg);
    white-space:pre-wrap;
  }
  .report-actions{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .report-copy{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--green);
    background:var(--green-bg);
    color:var(--green-text);
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .copy-status{
    font-size:0.82rem;
    color:var(--green-text);
    font-weight:600;
  }
  .save-warning{
    display:none;
    margin:12px 16px 0;
    border:1px solid var(--danger);
    background:var(--danger-bg);
    color:var(--danger-ink);
    border-radius:10px;
    padding:10px 14px;
    font-size:0.84rem;
    line-height:1.4;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }

  .view-toggle{display:none;gap:8px;margin:14px 16px 0;}
  .view-toggle.on{display:flex;}
  .vt{
    flex:1;padding:10px 8px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;font-family:inherit;font-weight:700;font-size:0.86rem;
    color:var(--ink-soft);cursor:pointer;touch-action:manipulation;
  }
  .vt.active{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}

  .zone-intro{
    margin:14px 16px 0;font-size:0.8rem;line-height:1.45;color:var(--ink-soft);
  }
  .zone{
    margin:14px 16px 0;border:1px solid var(--line);border-radius:10px;
    background:var(--card);overflow:hidden;
  }
  .zone-head{
    display:flex;align-items:center;gap:12px;padding:11px 14px;
    background:var(--green-bg);border-bottom:1px solid var(--line);
  }
  .zone-loc{flex-shrink:0;display:block;}
  .zone-id{flex:1;min-width:0;}
  .zone-name{font-weight:700;font-size:1.0rem;color:var(--green-text);display:block;}
  .zone-place{
    font-size:0.76rem;color:var(--ink-soft);display:block;margin-top:2px;
  }
  .zone-count{
    font-size:0.74rem;color:var(--ink-soft);display:block;margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .loaded-btn{
    border:1px solid var(--green);background:var(--card);color:var(--green-text);
    border-radius:8px;padding:7px 11px;font-family:inherit;font-weight:700;
    font-size:0.78rem;cursor:pointer;touch-action:manipulation;
  }
  .zone.done .zone-head{background:var(--green);}
  .zone.done .zone-name,.zone.done .zone-count{color:var(--on-green);}
  .zone.done .loaded-btn{background:var(--on-green);color:var(--green);}
  .zrow{
    display:flex;align-items:baseline;gap:10px;padding:9px 14px;
    border-top:1px solid var(--line);
  }
  .zqty{
    font-weight:700;min-width:46px;text-align:right;
    font-variant-numeric:tabular-nums;font-size:0.98rem;
  }
  .zname{flex:1;font-size:0.9rem;}
  .zcode{font-size:0.7rem;color:var(--ink-soft);letter-spacing:0.05em;}
  .zflag{
    font-size:0.68rem;color:var(--amber);font-weight:700;letter-spacing:0.03em;
    white-space:nowrap;
  }
  .zone-note{
    margin:16px 16px 0;border:1px solid var(--amber);border-radius:10px;
    background:var(--amber-bg);padding:12px 14px;font-size:0.83rem;line-height:1.45;
  }
  .zone-note b{color:var(--amber);}
</style>
</head>
<body>

<header>
  <h1>Wolf Architect Jobs</h1>
  <p class="subhead" id="dateLine"></p>
  <p class="asof">Plant sort counts &middot; four active jobs</p>
  <p class="savenote" id="saveNote">Loading your counts&hellip;</p>
  <div class="tabs" id="tabs"></div>
</header>

<div id="saveWarning" class="save-warning">
  Working offline. Counts are held on this device and will sync when you are back on signal.
</div>

<div class="report-btn-wrap">
  <button id="reportBtn" class="report-btn">Send status report to Chris</button>
</div>
<div id="reportPanel" class="report-panel" style="display:none;">
  <div class="report-panel-header">
    <span>Status report &mdash; all 4 jobs</span>
    <button id="closeReportBtn" class="report-close">&#10005; close</button>
  </div>
  <textarea id="reportText" class="report-textarea" readonly></textarea>
  <div class="report-actions">
    <button id="copyReportBtn" class="report-copy">Copy to clipboard</button>
    <span id="copyStatus" class="copy-status"></span>
  </div>
</div>

<div class="view-toggle" id="viewToggle">
  <button class="vt active" id="vtSpecies">Whole job</button>
  <button class="vt" id="vtZones">Pull by zone</button>
</div>

<div id="flagsSlot"></div>
<div id="groups"></div>

<footer>Counts save as you tap.</footer>

var state = {};
var notes = {};
var loaded = {};           // zone -> true once its plants are on the truck
var dbDoc = null;
var saveTimer = null;
var lastSavedAt = 0;

function decode(html){
  var d = document.createElement("textarea");
  d.innerHTML = html;
  return d.value;
}

function slug(name){
  return decode(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function readLocal(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    if(!raw) return null;
    var v = JSON.parse(raw);
    return (v && typeof v === "object") ? v : null;
  }catch(e){ return null; }
}

function writeLocal(p){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(p)); return true; }
  catch(e){ return false; }
}

function setSaveNote(msg){
  var el = document.getElementById("saveNote");
  if(el) el.textContent = msg;
}

var MSG_LOCAL_ONLY = "This copy saves to this device only. Counts stay in this browser — they will not follow you to another phone.";
var MSG_OFFLINE = "Working offline. Counts are held on this device and will sync when you are back on signal.";
var syncAvailable = null; // null = not checked yet, false = no sync here, true = sync exists

function setOffline(isOffline, msg){
  var el = document.getElementById("saveWarning");
  if(!el) return;
  el.style.display = isOffline ? "block" : "none";
  if(isOffline) el.textContent = msg || (syncAvailable === false ? MSG_LOCAL_ONLY : MSG_OFFLINE);
}

function payload(){
  return {counts: state, notes: notes, loaded: loaded,
          updatedAt: new Date().toISOString()};
}

function applyPayload(p){
  if(!p) return;
  if(p.counts && typeof p.counts === "object") state = Object.assign({}, p.counts);
  if(p.notes && typeof p.notes === "object") notes = Object.assign({}, p.notes);
  if(p.loaded && typeof p.loaded === "object") loaded = Object.assign({}, p.loaded);
}

function fillMissingFromSeed(){
  Object.keys(JOBS).forEach(function(jobKey){
    Object.keys(JOBS[jobKey].groups).forEach(function(gk){
      JOBS[jobKey].groups[gk].items.forEach(function(row){
        var k = jobKey + ":" + slug(row[0]);
        if(state[k] === undefined || state[k] === null){
          state[k] = SEED[k] !== undefined ? SEED[k] : 0;
        }
      });
    });
  });
}

function scheduleSave(){
  var p = payload();
  var localOk = writeLocal(p);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if(!dbDoc){
      setOffline(true);
      setSaveNote(localOk
        ? "Saved on this device only — not synced."
        : "NOT SAVING here. Send the status report before you close this.");
      return;
    }
    dbDoc.set(p).then(function(){
      lastSavedAt = Date.parse(p.updatedAt);
      setOffline(false);
      var t = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
      setSaveNote("Saved " + t + " — safe to close.");
    }).catch(function(){
      setOffline(true);
      setSaveNote("Saved on this device — will sync when signal returns.");
    });
  }, 250);
}

function jobProgress(jobKey){
  var complete = 0, total = 0;
  var job = JOBS[jobKey];
  Object.keys(job.groups).forEach(function(gk){
    job.groups[gk].items.forEach(function(row){
      total++;
      var k = jobKey + ":" + slug(row[0]);
      if((state[k] || 0) >= row[1]) complete++;
    });
  });
  return {complete: complete, total: total};
}

function renderTabs(){
  var tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  Object.keys(JOBS).forEach(function(jobKey){
    var p = jobProgress(jobKey);
    var btn = document.createElement("button");
    btn.className = "tab" + (jobKey === currentJob ? " active" : "");
    btn.innerHTML = '<span class="tab-name">' + JOBS[jobKey].short +
      '</span><span class="tab-progress">' + p.complete + "/" + p.total + " complete</span>";
    btn.addEventListener("click", function(){
      currentJob = jobKey;
      // The zone pull list only exists for Home2Suites; leaving that tab drops
      // back to the species view so the toggle never lies about what is shown.
      if(jobKey !== "h2s") view = "species";
      renderAll();
    });
    tabsEl.appendChild(btn);
  });
}

function renderFlags(){
  var slot = document.getElementById("flagsSlot");
  var job = JOBS[currentJob];
  if(!job.flags || job.flags.length === 0){ slot.innerHTML = ""; return; }

  var box = document.createElement("div");
  box.className = "flags";
  box.innerHTML = "<h2>Open with Chris</h2>" +
    job.flags.map(function(f){ return '<div class="flag-item">' + f + "</div>"; }).join("");

  var notesId = "notes-" + currentJob;
  var ta = document.createElement("textarea");
  ta.className = "notes";
  ta.id = notesId;
  ta.placeholder = "Notes — update here as Chris gets back to you...";
  ta.value = notes[notesId] || "";
  box.appendChild(ta);
  slot.innerHTML = "";
  slot.appendChild(box);

  ta.addEventListener("input", function(){
    notes[notesId] = ta.value;
    scheduleSave();
  });
}

function itemClass(v, target){
  return "item" + (v > target ? " over" : v === target ? " complete" : v > 0 ? " partial" : "");
}

function renderItem(jobKey, name, target, isAlt){
  var k = jobKey + ":" + slug(name);
  var received = state[k] || 0;
  var wrap = document.createElement("div");
  wrap.className = itemClass(received, target);

  var info = document.createElement("div");
  info.className = "item-info";
  info.innerHTML = '<div class="item-name">' + name + '</div><div class="item-target">need ' +
    target + (isAlt ? " (alt / optional)" : "") + "</div>";

  var counter = document.createElement("div");
  counter.className = "counter";

  var minus = document.createElement("button");
  minus.textContent = "−";
  minus.setAttribute("aria-label", "decrease " + decode(name));

  var input = document.createElement("input");
  input.type = "number";
  input.inputMode = "numeric";
  input.min = "0";
  input.value = received;
  input.setAttribute("aria-label", decode(name) + " received count");

  var plus = document.createElement("button");
  plus.textContent = "+";
  plus.setAttribute("aria-label", "increase " + decode(name));

  function commit(newVal){
    newVal = Math.max(0, parseInt(newVal, 10) || 0);
    state[k] = newVal;
    input.value = newVal;
    wrap.className = itemClass(newVal, target);
    renderTabs();
    scheduleSave();
  }

  minus.addEventListener("click", function(){ commit((state[k] || 0) - 1); });
  plus.addEventListener("click", function(){ commit((state[k] || 0) + 1); });
  input.addEventListener("change", function(){ commit(input.value); });

  counter.appendChild(minus);
  counter.appendChild(input);
  counter.appendChild(plus);
  wrap.appendChild(info);
  wrap.appendChild(counter);
  return wrap;
}

function renderGroups(){
  var container = document.getElementById("groups");
  container.innerHTML = "";
  var job = JOBS[currentJob];
  Object.keys(job.groups).forEach(function(gk){
    var g = job.groups[gk];
    var section = document.createElement("section");
    section.className = "group";
    var title = document.createElement("div");
    title.className = "group-title";
    title.innerHTML = g.label;
    section.appendChild(title);
    g.items.forEach(function(row){
      section.appendChild(renderItem(currentJob, row[0], row[1], row[2]));
    });
    container.appendChild(section);
  });
}

// A thumbnail of the same 3x3 grid as the printed packet, with this zone filled.
// North is up on sheet L102 (checked against its compass), the building sits in
// the middle cell, and Duane Drive runs along the south edge -- which is enough
// to place yourself without unrolling the big sheet.
function zoneLocator(z){
  var row = "ABC".indexOf(z.charAt(0));
  var col = parseInt(z.charAt(1), 10) - 1;
  var cells = "";
  for(var r = 0; r < 3; r++){
    for(var c = 0; c < 3; c++){
      var on = (r === row && c === col);
      cells += '<rect x="' + (3 + c * 22) + '" y="' + (17 + r * 22) + '" width="20" height="20"'
        + ' fill="' + (on ? "var(--green)" : "var(--card)") + '"'
        + ' stroke="var(--line)" stroke-width="1"/>';
    }
  }
  // Building footprint hint, centred on B2.
  var bldg = '<rect x="30" y="44" width="12" height="12" fill="none"'
    + ' stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 2"/>';
  return '<svg class="zone-loc" viewBox="0 0 72 96" width="58" height="77" role="img"'
    + ' aria-label="Zone ' + z + ' position, north at top">'
    + '<text x="36" y="8" text-anchor="middle" font-size="9" font-weight="700"'
    + ' fill="var(--ink-soft)">N</text>'
    + '<path d="M36 9 l3.5 6 h-7 z" fill="var(--ink-soft)"/>'
    + cells + bldg
    + '<text x="36" y="92" text-anchor="middle" font-size="7.5"'
    + ' fill="var(--ink-soft)">Duane Dr</text>'
    + "</svg>";
}

function renderZones(){
  var container = document.getElementById("groups");
  container.innerHTML = "";

  var intro = document.createElement("p");
  intro.className = "zone-intro";
  intro.innerHTML = "Everything sheet L102 calls for, totalled per zone of the printed "
    + "field packet &mdash; <b>A2 here is the A2 page there</b>. North is up: "
    + "<b>A</b> row is the north side (storm water, parking row), <b>C</b> row fronts "
    + "Duane Drive, column <b>1</b> is west and <b>3</b> is east. The building is B2. "
    + "Load the buggy from one card, drive to that corner, tap Mark loaded.";
  container.appendChild(intro);

  Object.keys(ZONES).forEach(function(z){
    var zone = ZONES[z];
    var codes = Object.keys(zone.items).sort(function(a, b){
      return zone.items[b] - zone.items[a];
    });
    var units = codes.reduce(function(n, c){ return n + zone.items[c]; }, 0);
    var isDone = !!(loaded[z]);

    var card = document.createElement("section");
    card.className = "zone" + (isDone ? " done" : "");

    var head = document.createElement("div");
    head.className = "zone-head";
    head.innerHTML = zoneLocator(z) +
      '<span class="zone-id">' +
        '<span class="zone-name">Zone ' + z + "</span>" +
        '<span class="zone-place">' + zone.place + "</span>" +
        '<span class="zone-count">' + codes.length + " species &middot; " + units + " units</span>" +
      "</span>";

    var btn = document.createElement("button");
    btn.className = "loaded-btn";
    btn.textContent = isDone ? "Loaded" : "Mark loaded";
    btn.addEventListener("click", function(){
      loaded[z] = !loaded[z];
      scheduleSave();
      renderZones();
    });
    head.appendChild(btn);
    card.appendChild(head);

    codes.forEach(function(c){
      var row = document.createElement("div");
      row.className = "zrow";
      var flag = DISCREPANCY[c]
        ? '<span class="zflag">check plan</span>' : "";
      row.innerHTML = '<span class="zqty">' + zone.items[c] + "</span>" +
        '<span class="zname">' + SPECIES[c] + ' <span class="zcode">' + c + "</span></span>" +
        flag;
      card.appendChild(row);
    });

    container.appendChild(card);
  });

  var note = document.createElement("div");
  note.className = "zone-note";
  note.innerHTML = "<b>Three species do not add up.</b> The callouts on the sheet total "
    + "73 Miss Kim Lilac against a schedule of 45, 252 False Spirea against 226, and 58 "
    + "Birchleaf Spirea against 63. Every other species matches exactly. The zone numbers "
    + "above are what the sheet actually draws &mdash; settle the three with Peter Briggs "
    + "at Corvus before ordering to them.";
  container.appendChild(note);
}

function renderAll(){
  renderTabs();
  var showZones = (currentJob === "h2s");
  var toggle = document.getElementById("viewToggle");
  toggle.classList.toggle("on", showZones);
  document.getElementById("vtSpecies").classList.toggle("active", view === "species");
  document.getElementById("vtZones").classList.toggle("active", view === "zones");

  if(showZones && view === "zones"){
    document.getElementById("flagsSlot").innerHTML = "";
    renderZones();
  } else {
    renderFlags();
    renderGroups();
  }
}

function generateReport(){
  var lines = [];
  lines.push("TITAN ALASKA -- PLANT SORT STATUS");
  lines.push(new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric", year: "numeric"
  }));
  lines.push("");
  Object.keys(JOBS).forEach(function(jobKey){
    var job = JOBS[jobKey];
    var p = jobProgress(jobKey);
    lines.push(decode(job.label).toUpperCase() + " (" + p.complete + "/" + p.total + " complete)");
    Object.keys(job.groups).forEach(function(gk){
      job.groups[gk].items.forEach(function(row){
        var name = row[0], target = row[1], isAlt = row[2];
        var k = jobKey + ":" + slug(name);
        var received = state[k] || 0;
        var status;
        if(received > target) status = "OVER by " + (received - target);
        else if(received === target) status = "complete";
        else if(received > 0) status = "short " + (target - received);
        else status = "open";
        lines.push("- " + decode(name) + ": " + received + "/" + target +
          (isAlt ? " (alt)" : "") + " -- " + status);
      });
    });
    if(job.flags && job.flags.length){
      lines.push("Flags:");
      job.flags.forEach(function(f){
        var tmp = document.createElement("div");
        tmp.innerHTML = f;
        lines.push("- " + (tmp.textContent || "").trim());
      });
    }
    var noteText = (notes["notes-" + jobKey] || "").trim();
    if(noteText){
      lines.push("Notes:");
      lines.push(noteText);
    }
    lines.push("");
  });

  lines.push("HOME2SUITES -- PULL LIST BY ZONE (from sheet L102)");
  lines.push("Zones are the 3x3 grid of the printed field packet. North is up:");
  lines.push("A row = north side, C row = Duane Drive frontage, 1 = west, 3 = east.");
  lines.push("The building is B2.");
  Object.keys(ZONES).forEach(function(z){
    var zone = ZONES[z];
    var codes = Object.keys(zone.items).sort(function(a, b){
      return zone.items[b] - zone.items[a];
    });
    var units = codes.reduce(function(n, c){ return n + zone.items[c]; }, 0);
    lines.push("Zone " + z + " -- " + zone.place + " (" + units + " units)" +
               (loaded[z] ? " [LOADED]" : ""));
    codes.forEach(function(c){
      lines.push("  " + zone.items[c] + " x " + SPECIES[c] + " (" + c + ")" +
                 (DISCREPANCY[c] ? "  ** " + DISCREPANCY[c] + " **" : ""));
    });
  });
  lines.push("");
  lines.push("NOTE: three species do not reconcile against the sheet's own schedule --");
  Object.keys(DISCREPANCY).forEach(function(c){
    lines.push("  " + SPECIES[c] + ": " + DISCREPANCY[c]);
  });
  lines.push("Every other species matches exactly. Confirm with Corvus Design before ordering.");
  lines.push("");

  return lines.join("\n");
}

function wireReportUI(){
  var reportBtn = document.getElementById("reportBtn");
  var panel = document.getElementById("reportPanel");
  var textarea = document.getElementById("reportText");
  var copyBtn = document.getElementById("copyReportBtn");
  var closeBtn = document.getElementById("closeReportBtn");
  var statusEl = document.getElementById("copyStatus");

  function selectAll(){
    textarea.focus();
    textarea.setSelectionRange(0, textarea.value.length);
  }

  reportBtn.addEventListener("click", function(){
    var text = generateReport();
    textarea.value = text;
    panel.style.display = "block";
    panel.scrollIntoView({behavior: "smooth", block: "start"});
    selectAll();
    if(navigator.share){
      navigator.share({text: text, title: "Titan Alaska -- Plant Sort Status"})
        .then(function(){
          statusEl.textContent = "Shared";
          setTimeout(function(){ statusEl.textContent = ""; }, 3000);
        })
        .catch(function(){
          statusEl.textContent = "Text is selected below — long-press and Copy";
        });
      return;
    }
    statusEl.textContent = "Text is selected below — long-press and Copy";
  });

  closeBtn.addEventListener("click", function(){
    panel.style.display = "none";
  });

  copyBtn.addEventListener("click", function(){
    selectAll();
    function fallback(){
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      statusEl.textContent = ok ? "Copied" : "Long-press the text above and Copy";
      setTimeout(function(){ statusEl.textContent = ""; }, 3000);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(textarea.value).then(function(){
        statusEl.textContent = "Copied";
        setTimeout(function(){ statusEl.textContent = ""; }, 3000);
      }).catch(fallback);
    } else {
      fallback();
    }
  });
}

function init(){
  document.getElementById("dateLine").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  // 1. Paint straight away from the local mirror, or the 9/8 baseline.
  var local = readLocal();
  applyPayload(local);
  fillMissingFromSeed();
  document.getElementById("vtSpecies").addEventListener("click", function(){
    view = "species"; renderAll();
  });
  document.getElementById("vtZones").addEventListener("click", function(){
    view = "zones"; renderAll();
  });

  renderAll();
  wireReportUI();
  setSaveNote(local ? "Counts loaded from this device." : "Starting from the September 8 baseline.");

  // 2. Then reach for the shared store and take it if it is newer.
  (function(){
    var usePromise;
    try{ usePromise = claude.use("db"); }
    catch(e){ usePromise = Promise.resolve(null); }

    Promise.resolve(usePromise).then(function(db){
      if(!db){
        syncAvailable = false;
        setOffline(true, MSG_LOCAL_ONLY);
        setSaveNote("Saves to this device only.");
        return;
      }
      syncAvailable = true;
      dbDoc = db.doc(DOC_PATH);

      return dbDoc.get().then(function(snap){
        var remote = (snap && snap.data) ? snap.data : snap;
        var localAt = (local && local.updatedAt) ? Date.parse(local.updatedAt) : 0;
        var remoteAt = (remote && remote.updatedAt) ? Date.parse(remote.updatedAt) : 0;

        if(remote && remote.counts && remoteAt >= localAt){
          applyPayload(remote);
          fillMissingFromSeed();
          lastSavedAt = remoteAt;
          renderAll();
          setSaveNote("Synced — showing the latest counts.");
          setOffline(false);
        } else {
          var p = payload();
          return dbDoc.set(p).then(function(){
            lastSavedAt = Date.parse(p.updatedAt);
            setSaveNote("Synced — this device had the newer counts.");
            setOffline(false);
          });
        }
      }).then(function(){
        try{
          dbDoc.onSnapshot(function(snap){
            var remote = (snap && snap.data) ? snap.data : snap;
            if(!remote || !remote.updatedAt || !remote.counts) return;
            var at = Date.parse(remote.updatedAt);
            if(at <= lastSavedAt) return;
            lastSavedAt = at;
            applyPayload(remote);
            fillMissingFromSeed();
            renderAll();
          });
        }catch(e){ /* live updates are a bonus */ }
      });
    }).catch(function(){
      setOffline(true);
      setSaveNote("Saved on this device — will sync when signal returns.");
    });
  })();
}

init();
</script>

    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
